<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Marble Roulette | 마블 룰렛</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="물리 엔진 기반 실시간 구슬 룰렛 추첨기">
  <link rel="stylesheet" href="assets/style.scss">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="logo">
      <span class="logo-icon">🎯</span>
      <span class="logo-title">Marble Roulette</span>
    </div>
    <div class="header-actions">
      <button id="btnToggleSettings" class="btn-header-action" title="Setup / Settings">
        <span>⚙️</span>
        <span class="header-action-text" data-trans>Settings</span>
      </button>
    </div>
  </header>

  <!-- Setup / Settings Drawer Panel -->
  <aside id="settings" class="settings-drawer">
    <div class="drawer-header">
      <div class="drawer-title-row">
        <h2 data-trans>Enter names below</h2>
        <span id="marbleCountBadge" class="badge-counter">0 Marbles</span>
      </div>
      <p class="drawer-subtitle">줄바꿈 또는 쉼표로 구분하여 입력 (예: 수박*2, 키위/3)</p>
    </div>

    <!-- Presets Bar -->
    <div class="presets-row">
      <button class="btn-preset" data-preset="1-10">1~10</button>
      <button class="btn-preset" data-preset="1-20">1~20</button>
      <button class="btn-preset" data-preset="fruits">과일</button>
      <button class="btn-preset" data-preset="dice">주사위</button>
      <button class="btn-preset" data-preset="lunch">점심메뉴</button>
      <button class="btn-preset btn-preset-clear" data-preset="clear">비우기</button>
    </div>

    <!-- Textarea Input -->
    <div class="input-container">
      <textarea id="in_names" spellcheck="false" placeholder="수박*2&#10;키위*2&#10;귤*2&#10;딸기*2&#10;바나나*2"></textarea>
    </div>

    <!-- Settings Grid -->
    <div class="settings-grid">
      <!-- Map Selection -->
      <div class="setting-item">
        <label for="sltMap">
          <span class="item-icon">🗺️</span>
          <span data-trans>Map</span>
        </label>
        <div class="select-wrapper">
          <select id="sltMap"></select>
        </div>
      </div>

      <!-- Winner Selection -->
      <div class="setting-item full-width">
        <label>
          <span class="item-icon">🏆</span>
          <span data-trans>The winner is</span>
        </label>
        <div class="winner-mode-group">
          <button type="button" class="btn-mode btn-first-winner active" data-trans>First</button>
          <button type="button" class="btn-mode btn-last-winner" data-trans>Last</button>
          <button type="button" class="btn-mode btn-custom-winner" data-trans>Custom</button>
          <input type="number" id="in_winningRank" min="1" value="1" />
        </div>
      </div>

      <!-- Toggles -->
      <div class="toggle-grid full-width">
        <label class="toggle-card">
          <input type="checkbox" id="chkSkill" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-label">
            <span class="toggle-icon">💥</span>
            <span data-trans>Using skills</span>
          </span>
        </label>

        <label class="toggle-card">
          <input type="checkbox" id="chkSound" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-label">
            <span class="toggle-icon">🔊</span>
            <span data-trans>Sound</span>
          </span>
        </label>

        <label class="toggle-card">
          <input type="checkbox" id="chkDarkMode" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-label">
            <span class="toggle-icon">🌙</span>
            <span data-trans>Theme</span>
          </span>
        </label>

        <label class="toggle-card">
          <input type="checkbox" id="chkAutoRecording">
          <span class="toggle-slider"></span>
          <span class="toggle-label">
            <span class="toggle-icon">🔴</span>
            <span data-trans>Recording</span>
          </span>
        </label>
      </div>
    </div>

    <!-- Drawer Footer Actions -->
    <div class="drawer-actions">
      <button id="btnShuffle" class="btn-secondary">
        <span class="btn-icon">🔀</span>
        <span data-trans>Shuffle</span>
      </button>
      <button id="btnStart" class="btn-primary">
        <span class="btn-icon">▶</span>
        <span data-trans>Start</span>
      </button>
    </div>

    <div class="drawer-footer-credit">
      Based on original project by <a href="https://github.com/lazygyu/roulette" target="_blank" rel="noopener">lazygyu/roulette</a>
    </div>
  </aside>

  <!-- Live In-Game Leaderboard Overlay -->
  <aside id="leaderboardHud" class="leaderboard-hud hidden">
    <div class="leaderboard-header">
      <span class="hud-icon">⚡</span>
      <span data-trans>Live Standings</span>
    </div>
    <ul id="leaderboardList" class="leaderboard-list"></ul>
  </aside>

  <!-- Floating Bottom Control Dock -->
  <div id="hudDock" class="hud-dock hidden">
    <button id="btnHudPause" class="btn-hud" title="Pause / Resume">⏸️</button>
    <button id="btnHudSpeed" class="btn-hud btn-hud-speed" title="Speed Multiplier">1x</button>
    <button id="btnHudShake" class="btn-hud" title="Shake Stuck Marbles">🌪️</button>
    <button id="btnHudSound" class="btn-hud" title="Toggle Sound">🔊</button>
    <div class="hud-divider"></div>
    <button id="btnHudReset" class="btn-hud btn-hud-reset" title="Reset & Setup">🔄</button>
  </div>

  <!-- Winner / Podium Celebration Modal -->
  <div id="winnerModal" class="winner-modal-overlay hidden">
    <div class="winner-modal-card">
      <div class="trophy-wrapper">
        <div class="trophy-glow"></div>
        <div class="trophy-symbol">🏆</div>
      </div>
      <div class="winner-subtitle">
        <span id="winnerRankBadge" class="winner-badge">1st Place</span>
        <span id="winnerTotalCount" class="total-badge">Total: 10</span>
      </div>
      <h1 id="winnerName" class="winner-name">수박</h1>

      <!-- Full Standings Table -->
      <div class="standings-table-container">
        <table class="standings-table">
          <thead>
            <tr>
              <th data-trans>Rank</th>
              <th data-trans>Winner</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="rankingTableBody"></tbody>
        </table>
      </div>

      <!-- Action Buttons -->
      <div class="winner-actions">
        <button id="btnCopyResult" class="btn-modal-action btn-copy">
          <span class="btn-icon">📋</span>
          <span data-trans>Copy Results</span>
        </button>
        <button id="btnPlayAgain" class="btn-modal-action btn-rematch">
          <span class="btn-icon">🔄</span>
          <span data-trans>Play Again</span>
        </button>
        <button id="btnCloseWinner" class="btn-modal-action btn-close-modal" data-trans>Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/index.ts"></script>
</body>
</html>
